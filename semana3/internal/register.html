<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Login de la APP</title>
	<link rel="stylesheet" type="text/css" href="../css/estilos.css">
	<link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
</head>
<body class="bodylogin">
	<section class="wrapper">
		<form action="guardarRegistro.php" method="post">
			<h1>Register APP</h1>
			<div class="input-box">
				<input type="text" name="username" placeholder="Username">
				<i class="bx bx-user" ></i>
			</div>			
            <div class="input-box">
				<input type="text" name="email" placeholder="Email">
				<i class="bx bx-lock"></i>
			</div>
            <div class="input-box">
				<input type="password" name="password" placeholder="Password">
				<i class="bx bx-lock"></i>
			</div>
            <div class="input-box">
                    <select name="rol" aria-label="Rol" required>
                        <option value="" disabled selected>Selecciona un rol</option>
                        <option value="1">1. Administrador</option>
                        <option value="2">2. Colaborador</option>
                        <option value="3">3. Usuario</option>
                    </select>
                </div>
		
			<button type="submit" class="btn"> Guardar</button>
			<div class="register-link">
				<p>Ya tienes una cuenta? <a href="login.html">Iniciar Sesion</a></p>
			</div>
		</form>
	</section>
</body>
</html>
